name: nuevodiseno

# Compila nuevodiseno-src/ y commitea el resultado en la raíz del repo, que es lo que sirve Cloudflare Pages en maraschmitman.com.
on:
  push:
    paths:
      - 'nuevodiseno-src/**'
      - '.github/workflows/nuevodiseno.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuevodiseno-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nuevodiseno-src/package-lock.json

      - name: Instalar dependencias
        working-directory: nuevodiseno-src
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Revisar tipos
        working-directory: nuevodiseno-src
        run: npx tsc --noEmit

      - name: Compilar
        working-directory: nuevodiseno-src
        run: npm run build

      - name: Publicar el build en la raíz
        run: |
          rm -rf index.html assets img agendar
          cp -R nuevodiseno-src/dist/. .

      - name: Commitear el build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets img agendar
          if git diff --cached --quiet; then
            echo "Sin cambios en el build."
          else
            git commit -m "Build del sitio"
            git push
          fi
