name: versiones

# Compila cada versión de prueba de versiones/<vN>/ y commitea el resultado en nuevodiseno/<vN>/,
# que Cloudflare Pages sirve en maraschmitman.com/nuevodiseno/<vN>/. No toca la home.
on:
  push:
    paths:
      - 'versiones/**'
      - '.github/workflows/versiones.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: versiones-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: versiones/*/package-lock.json

      - name: Compilar cada versión
        run: |
          for dir in versiones/*/; do
            v=$(basename "$dir")
            [ -f "$dir/package.json" ] || continue
            echo "== $v"
            (cd "$dir" && npm ci --legacy-peer-deps --no-audit --no-fund && npx tsc --noEmit && npm run build)
            rm -rf "nuevodiseno/$v"
            mkdir -p nuevodiseno
            cp -R "$dir/dist" "nuevodiseno/$v"
          done

      - name: Commitear el build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A nuevodiseno
          if git diff --cached --quiet; then
            echo "Sin cambios en el build."
          else
            git commit -m "Build de versiones de prueba"
            git pull --rebase
            git push
          fi
